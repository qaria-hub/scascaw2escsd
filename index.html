<title>Special Unit 110 | پلتفرم</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap" rel="stylesheet">

<style>
:root{--bg:#1a1c19;--card:#242721;--line:#34382f;--brown:#5d4723;--tan:#ad9476;--grey:#aea191;--olive:#718549;--red:#a4020c;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--grey);font-family:Vazirmatn,Tahoma,sans-serif;font-size:14px}
header{background:var(--bg);border-bottom:3px solid var(--brown);color:var(--tan);padding:10px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px}.brand{display:flex;align-items:center;gap:12px;min-width:0}.brand img.e{height:46px;width:46px}.brand img.w{height:30px;max-width:100%;object-fit:contain}.brand small{display:block;color:var(--grey);font-size:11px;margin-top:2px}
.app{display:none;align-items:flex-start}body.in .app{display:flex}
#lg{position:fixed;inset:0;background:var(--bg);z-index:50;display:flex;align-items:center;justify-content:center;padding:14px}#lg form{background:var(--card);border-radius:12px;padding:22px;width:100%;max-width:340px;border-top:4px solid var(--olive)}#lg h3{margin:0 0 6px;color:var(--tan)}#lm{color:#e5535e;min-height:20px;margin-top:8px}#who{display:none;align-items:center;gap:8px}body.in #who{display:flex}
nav{flex:none;width:210px;display:flex;flex-direction:column;gap:4px;overflow-y:auto;padding:10px 8px;background:var(--card);border-left:2px solid var(--olive);position:sticky;top:0;align-self:flex-start;max-height:100vh;min-height:calc(100vh - 70px)}
nav button{flex:none;width:100%;text-align:right;background:none;border:0;color:var(--grey);padding:10px 14px;border-radius:8px;font:inherit;cursor:pointer}nav button:hover{background:var(--line)}
nav button.on{background:var(--olive);color:#fff;font-weight:600}
main{flex:1;min-width:0;max-width:980px;margin:0 auto;padding:14px}
@media(max-width:720px){.app{flex-direction:column;align-items:stretch}nav{width:auto;flex-direction:row;overflow-x:auto;overflow-y:hidden;position:static;max-height:none;min-height:0;border-left:0;border-bottom:2px solid var(--olive)}nav button{width:auto;flex:none;text-align:center;white-space:nowrap}}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px}
.stat b{display:block;font-size:22px;color:var(--tan);margin-top:4px}
h3{margin:0 0 10px;color:var(--tan)}
.bar{display:flex;align-items:center;gap:8px;margin:6px 0}
.bar i{display:block;height:14px;border-radius:4px;min-width:4px}
.tool{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
input,select,textarea{background:var(--bg);color:#e6e0d4;border:1px solid var(--line);border-radius:8px;padding:8px;font:inherit;width:100%}
.tool input,.tool select{width:auto;flex:1;min-width:120px}
.btn{background:var(--olive);color:#fff;border:0;border-radius:8px;padding:8px 14px;font:inherit;cursor:pointer}
.btn.s{background:var(--brown);padding:4px 10px;font-size:12px}
.btn.d{background:transparent;border:1px solid var(--line);color:var(--grey);padding:4px 10px;font-size:12px}.btn.d:hover{background:var(--red);color:#fff}
.row{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
.item{margin-bottom:8px}
.item .t{color:#efe9dc;font-weight:600}
.tag{display:inline-block;border-radius:20px;padding:1px 10px;font-size:12px;color:#fff;margin-inline-end:4px}
.muted{font-size:12px}
.late{color:#e5535e}
#m{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;padding:14px;z-index:9}
#m>div{background:var(--card);border-radius:12px;padding:16px;width:100%;max-width:440px;max-height:90%;overflow:auto;border-top:4px solid var(--olive)}
label{display:block;margin:8px 0 3px;font-size:12px;color:var(--tan)}
.ck,.sub{display:flex;align-items:center;gap:6px;margin:0;font-size:14px;color:inherit;cursor:pointer}
.ck input,.sub input{width:auto}.sub{margin:4px 26px 0 0;font-size:13px}
.tk{border-top:1px solid var(--line);padding:8px 0}.dn .t{text-decoration:line-through;opacity:.55}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse}th,td{padding:7px 9px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}th{color:var(--tan);font-size:12px;font-weight:600}tr.tt td{border-top:2px solid var(--olive);color:var(--tan);font-weight:700}
</style>

let db={c:[],p:[],o:[],f:[],w:[],d:[],x:[],iv:[]},tab='dash',q='',fch='';

const API_URL='platform_api.php';
let syncTimer=null,syncDirty=false,syncReady=false,syncBusy=false;
function syncState(){return {db,users,roles:ROLES};}
function scheduleSync(){
  if(!syncReady)return;
  syncDirty=true;
  clearTimeout(syncTimer);
  syncTimer=setTimeout(syncPush,450);
}
async function syncPush(){
  if(syncBusy||!syncReady)return;
  syncBusy=true;
  try{
    const r=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'application/json'},cache:'no-store',body:JSON.stringify({action:'save',state:syncState()})});
    if(!r.ok)throw new Error('HTTP '+r.status);
    const j=await r.json();
    if(!j.ok)throw new Error(j.error||'خطای سرور');
    syncDirty=false;
  }catch(e){syncReady=false;toast('ذخیره مرکزی انجام نشد؛ اطلاعات فعلاً روی همین دستگاه نگه داشته شد');}
  finally{syncBusy=false}
}
function normalizeState(st){
  if(!st)return null;
  const nd=st.db||{};
  db=Object.assign({c:[],p:[],o:[],f:[],w:[],d:[],x:[],iv:[]},nd);
  db.w=db.w||[];db.d=db.d||[];db.x=db.x||[];db.iv=db.iv||[];
  if(st.users)users=Array.isArray(st.users)?st.users:users;
  if(st.roles)ROLES=st.roles;
}
async function syncPull(force){
  if(syncBusy)return;
  syncBusy=true;
  try{
    const r=await fetch(API_URL+'?action=load',{cache:'no-store'});
    if(!r.ok)throw new Error('HTTP '+r.status);
    const j=await r.json();
    if(!j.ok)throw new Error(j.error||'خطای سرور');
    syncReady=true;
    if(j.hasData){
      if(force||!syncDirty){normalizeState(j.state);localStorage.setItem('tcrm',JSON.stringify(db));localStorage.setItem('tcrm_users',JSON.stringify(users));localStorage.setItem('tcrm_roles',JSON.stringify(ROLES));}
    }else{
      syncBusy=false;
      await syncPush();
    }
  }catch(e){syncReady=false;}
  finally{syncBusy=false}
}
function startSync(){
  syncPull(true).then(()=>{if(me)render();});
  setInterval(()=>{if(me&&!syncDirty&&!syncBusy)syncPull(false).then(()=>render());},15000);
}

function usersTab(){
  const ng=users.filter(x=>x.r=='god').length;
  let h=`<div class="tool"><button class="btn" onclick="userForm()">+ کاربر جدید</button></div><div class="muted" style="margin-bottom:10px">هر رول فقط بخش‌های مشخصی را می‌بیند. رمزها رمزنگاری‌شده ذخیره می‌شوند و قابل نمایش نیستند.</div>`;
  h+=users.map(u=>{
    const r=ROLES[u.r]||['—',[]],tb=u.r=='god'?'همه بخش‌ها (از جمله کاربران)':(r[1]||[]).map(k=>(TABS.find(t=>t[0]==k)||[k,k])[1]).join('، ');
    const actions=u.u==me.u||(u.r=='god'&&ng<2)?'':`<button class="btn d" onclick="userDel('${esc(u.u)}')">حذف</button>`;
    return `<div class="card item"><div class="row"><div><b>${esc(u.n||u.u)}</b> <span class="muted" dir="ltr">${esc(u.u)}</span> <span class="tag" style="background:${u.r=='god'?'#5d4723':'#718549'}">${esc(r[0])}</span><div class="muted" style="margin-top:4px">${tb||'بدون دسترسی'}</div></div><div><button class="btn s" onclick="userForm('${esc(u.u)}')">ویرایش</button> ${actions}</div></div></div>`;
  }).join('');
  return h+(me.r=='god'?rolesTab():'');
}
function userDel(un){ask('این کاربر حذف شود؟',()=>{users=users.filter(x=>x.u!=un);usave();render()})}
function userForm(un){const cur=un&&users.find(x=>x.u==un);if(cur&&cur.r=='god'&&me.r!='god'){toast('دسترسی ویرایش این کاربر را نداری');return}
form(cur?'ویرایش کاربر':'کاربر جدید',[{k:'n',l:'نام نمایشی'},{k:'u',l:'نام کاربری (حروف انگلیسی و عدد)'+(cur?' - غیرقابل تغییر':'')},{k:'r',l:'رول / سطح دسترسی',t:'select',o:Object.entries(ROLES).filter(([k])=>me.r=='god'||k!='god').map(([k,v])=>[k,v[0]])},{k:'p',l:cur?'رمز عبور جدید (خالی = بدون تغییر)':'رمز عبور (حداقل ۸ کاراکتر)',t:'password'}],cur?{n:cur.n,u:cur.u,r:cur.r}:{r:'manager'},r=>{
const u=cur?cur.u:r.u.trim().toLowerCase();
if(!cur&&!/^[a-z0-9._-]{3,30}$/.test(u)){toast('نام کاربری: ۳ تا ۳۰ حرف انگلیسی، عدد یا . _ -');return false}
if(!cur&&users.some(x=>x.u==u)){toast('این نام کاربری قبلاً ثبت شده');return false}
if((!cur||r.p)&&r.p.length<8){toast('رمز عبور حداقل ۸ کاراکتر باشد');return false}
if(cur&&cur.r=='god'&&r.r!='god'&&users.filter(x=>x.r=='god').length<2){toast('باید حداقل یک کاربر گاد بماند');return false}
(async()=>{const o=cur||{u,s:''};o.n=r.n.trim()||u;o.r=r.r;if(r.p){o.s=newSalt();o.h=await ph(r.p,o.s)}if(!cur)users.push(o);usave();$('#m').style.display='none';if(me.u==o.u){me=o;$('#who').firstChild.textContent=o.n}render()})();
return false})}
function render(keep){
  if(!me)return;const al=allowed(me);if(!al.includes(tab))tab=al[0];
  $('#nav').innerHTML=TABS.filter(t=>al.includes(t[0])).map(([k,l])=>`<button class="${k==tab?'on':''}" onclick="tab='${k}';render()">${l}</button>`).join('');
  $('#v').innerHTML=({dash,cust:custs,prod:prods,ord:ords,fu:fus,money:moneyTab,finance:finTab,inv:invTab,work,users:usersTab})[tab]();
  if(keep){const i=document.querySelector('.tool input');if(i){i.focus();i.setSelectionRange(i.value.length,i.value.length)}}
}
boot();
let last=iso();setInterval(()=>{const n=iso();if(n!=last){last=n;$('#today').textContent=dt(n);render()}},60000);
</script>
</body>
</html>
